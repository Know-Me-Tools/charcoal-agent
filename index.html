<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme and font size before first paint (key: knowme:ui,
      // written by src/stores/ui-store.ts). Dark is the default.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("knowme:ui") || "{}").state || {};
          var root = document.documentElement;
          root.classList.toggle("dark", saved.theme !== "light");
          root.dataset.fontSize = saved.fontSize || "default";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowMe — AI that understands you.</title>
    <meta name="description" content="KnowMe is your personal intelligence: a private, capable agent that remembers what matters to you and acts on your behalf." />
    <meta name="author" content="KnowMe AI, LLC" />
    <meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews: self-hosted image (regenerate with npm run brand:assets). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KnowMe" />
    <meta property="og:title" content="KnowMe" />
    <meta property="og:description" content="AI that understands you." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KnowMe — AI that understands you." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KnowMe" />
    <meta name="twitter:description" content="AI that understands you." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
