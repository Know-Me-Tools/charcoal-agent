# The CI deploy identity. Paired with a long-lived token Secret (not
# `kubectl create token`, which defaults to a 1-hour TTL and isn't suitable
# for a kubeconfig stored as a long-lived GitHub secret — see
# mint-deployer-kubeconfig.sh for why).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowme-deployer
  namespace: knowme
  labels:
    app.kubernetes.io/part-of: knowme-site
---
apiVersion: v1
kind: Secret
metadata:
  name: knowme-deployer-token
  namespace: knowme
  labels:
    app.kubernetes.io/part-of: knowme-site
  annotations:
    kubernetes.io/service-account.name: knowme-deployer
type: kubernetes.io/service-account-token
