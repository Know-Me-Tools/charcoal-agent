# Only uar, surreal-memory-server and knowme-web may reach surrealdb:8000.
# knowme-web connects for the site-spend-ceiling meter (ns=site/db=meter),
# through a user scoped to that database only (k8s-stack-manifests 1.6) —
# it has no rights in uar's or the memory server's namespace/database, so
# this NetworkPolicy widening the reachable pod set does not widen the data
# a compromised knowme-web pod can reach. Selecting the surrealdb pods with
# any ingress rule makes NetworkPolicy deny everything else to them by
# default — no separate default-deny policy is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uar-and-memory-server-to-surrealdb
  namespace: knowme
  labels:
    app.kubernetes.io/part-of: knowme-site
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: uar
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: surreal-memory-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: knowme-web
        # One-shot Job (scripts/ops/bootstrap-site.sh meter-user) that defines the
        # site meter's database user; its own label so it never joins a Service.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: site-meter-bootstrap
      ports:
        - protocol: TCP
          port: 8000
