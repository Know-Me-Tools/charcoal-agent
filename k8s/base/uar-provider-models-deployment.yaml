# uar-provider-models — re-applies the provider model limits in
# provider-models/provider-models.json to UAR and keeps those models verified.
# See provider-models/reconcile.sh for why (UAR 1.4.0-rc.2 needs them before it
# will verify qwen3.8-max, and the settings store can lose them).
#
# To change a limit or add a model: edit provider-models/provider-models.json
# and merge. The ConfigMap name carries a content hash, so this Deployment rolls
# and applies the new values within a minute of the deploy.
#
# It is a separate Deployment, not a sidecar in the uar pod, so a fault here
# cannot make the uar pod NotReady. It only ever calls /api/providers/<id>
# (read, update, test) and /readyz. The admin key and the gate client secret
# are read from the Secrets UAR and the seed already use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uar-provider-models
  namespace: knowme
  labels:
    app.kubernetes.io/name: uar-provider-models
    app.kubernetes.io/component: tool
    app.kubernetes.io/part-of: knowme-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uar-provider-models
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uar-provider-models
        app.kubernetes.io/component: tool
        app.kubernetes.io/part-of: knowme-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile
          # Same pinned image as the alert-mailer CronJob (bash, curl, jq).
          image: alpine/k8s:1.33.4@sha256:b0523f0a244ddc4c8e055aa335c040d3d78b3ead5528f4544395f7f9f69c7b68
          command: ["bash", "/opt/uar-provider-models/reconcile.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROVIDER_MODELS_FILE
              value: /opt/uar-provider-models/provider-models.json
            - name: UAR_URL
              value: http://uar:6565
            - name: RECONCILE_INTERVAL_SECS
              value: "300"
            - name: SITE_GATE_TOKEN_URL
              value: https://gate.know-me.tools/oauth/token
            - name: UAR_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: UAR_SECURITY__SETTINGS_ADMIN_KEY
            - name: SITE_GATE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: site-gate-client
                  key: SITE_GATE_CLIENT_ID
            - name: SITE_GATE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: site-gate-client
                  key: SITE_GATE_CLIENT_SECRET
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /opt/uar-provider-models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: uar-provider-models
            items:
              - key: provider-models.json
                path: provider-models.json
              - key: reconcile.sh
                path: reconcile.sh
        - name: tmp
          emptyDir: {}
