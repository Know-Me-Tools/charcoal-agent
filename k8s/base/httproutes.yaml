# Attached to argocd/argocd-gateway. The HTTPS listeners (knowme-site-https,
# knowme-www-https) and their -http counterparts are added by the
# cluster-gateway-and-cert change (a separate PR in
# Prometheus-AGS/know-me-cluster); these routes will not attach — and traffic
# will not flow — until that change is merged. Verified against the live
# gateway 2026-09-30: `kubectl --context know-me get gateway argocd-gateway -n
# argocd -o jsonpath='{.spec.listeners[*].name}'` does not yet list them.
#
# D-7 (2026-10-03, uar-runtime-host-lockdown): `runtime.know-me.tools` is
# deleted, not kept behind a fail-closed gate policy. There is no HTTPRoute
# for the uar Service here, on any listener. UAR is reachable in-cluster only
# (see uar-networkpolicy.yaml) through knowme-web.
#
# Gateway API version confirmed served by the cluster: `kubectl --context
# know-me get crd httproutes.gateway.networking.k8s.io -o
# jsonpath='{.spec.versions[*].name}'` -> "v1 v1beta1"; using v1 (GA).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knowme-site
  namespace: knowme
  labels:
    app.kubernetes.io/name: knowme-web
    app.kubernetes.io/part-of: knowme-site
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: argocd
      name: argocd-gateway
      sectionName: knowme-site-https
  hostnames:
    - "know-me.tools"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # The site server streams AG-UI chat replies (SSE); Envoy's 15s default
      # would cut long replies. Matches the runtime route.
      timeouts:
        request: 300s
      backendRefs:
        - name: knowme-web
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knowme-site-http-redirect
  namespace: knowme
  labels:
    app.kubernetes.io/name: knowme-web
    app.kubernetes.io/part-of: knowme-site
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: argocd
      name: argocd-gateway
      sectionName: knowme-site-http
  hostnames:
    - "know-me.tools"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knowme-www-redirect
  namespace: knowme
  labels:
    app.kubernetes.io/name: knowme-web
    app.kubernetes.io/part-of: knowme-site
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: argocd
      name: argocd-gateway
      sectionName: knowme-www-https
  hostnames:
    - "www.know-me.tools"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: "know-me.tools"
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knowme-www-redirect-http
  namespace: knowme
  labels:
    app.kubernetes.io/name: knowme-web
    app.kubernetes.io/part-of: knowme-site
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: argocd
      name: argocd-gateway
      sectionName: knowme-www-http
  hostnames:
    - "www.know-me.tools"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: "know-me.tools"
            statusCode: 301
