# Non-secret UAR settings. Secrets (API keys, JWT secret, settings admin key,
# the SurrealDB password) live in Secret `uar-secrets`, created out-of-band
# by .github/workflows/site.yml — never committed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uar-config
  namespace: knowme
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/part-of: knowme-site
data:
  PORT: "6565"
  UAR_SERVER__PORT: "6565"
  UAR_SERVER__HOST: "0.0.0.0"
  UAR_SECURITY__JWT_REQUIRED: "true"
  # gate-site-credentials: UAR verifies flint-gate's ES256 tokens through
  # gate's JWKS (in-cluster), so the site server and the seed job use
  # gate-minted client-credentials tokens (sub=knowme-site, aud=uar).
  # Once jwks_url is set, UAR accepts only JWKS-verified tokens.
  UAR_SECURITY__JWKS_URL: "http://flint-gate.flint-core.svc:4456/.well-known/jwks.json"
  UAR_SECURITY__JWT_ISSUER: "https://gate.know-me.tools"
  UAR_SECURITY__JWT_AUDIENCE: "uar"

  UAR_PERSISTENCE__PROVIDER: "surreal"
  UAR_PERSISTENCE__DATABASE_URL: "http://surrealdb:8000"
  UAR_PERSISTENCE__VECTOR_DIMENSION: "1024"
  UAR_PERSISTENCE__SURREAL_USER: "root"
  UAR_PERSISTENCE__SURREAL_AUTH_LEVEL: "root"
  UAR_PERSISTENCE__SURREAL_NS: "uar"
  UAR_PERSISTENCE__SURREAL_DB: "uar"
  # UAR v1.1.0 treats a remote SurrealDB as non-durable unless the operator
  # attests it (src/uar/persistence/providers/surreal.rs: durable_instances =
  # local_durable || (remote && UAR_REMOTE_SURREAL_DURABILITY_ATTESTED == "1")).
  # Without it, any agent with a configured token budget (knowme-site has
  # extensions.budgets.max_tokens_per_turn) fails every run with "Run model
  # binding failed" (durable_accounting_unsupported), and durable ingestion is
  # off (KB uploads answer 503). The attestation is true here: surrealdb runs
  # `rocksdb:/data/database.db` on the retained 20Gi PVC surrealdb-data
  # (k8s/base/surrealdb-statefulset.yaml, storage class linode-block-storage-retain).
  # If that volume is ever replaced by emptyDir, remove this line first.
  UAR_REMOTE_SURREAL_DURABILITY_ATTESTED: "1"

  # Qwen Token Plan chat model. UAR_LLM__MODEL keeps the "provider/model"
  # shape only for liter-llm's registry bookkeeping; once UAR_LLM__BASE_URL
  # is non-empty, UAR sends just the model id on the wire, not "openai/"
  # (src/llm/registry.rs: has_explicit_base_url / split_model_string).
  UAR_LLM__MODEL: "openai/qwen3.8-max"
  # Token Plan endpoint (verified live, HTTP 200, 2026-09-30).
  UAR_LLM__BASE_URL: "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
  # UAR's liter-llm client defaults to a 60 s TOTAL timeout (llm.timeout_secs,
  # src/config.rs), reqwest-style: it also cuts a stream that is still producing
  # output. Replies that take longer than that (long answers, SVG, a slow first
  # token from the reasoning model) ended with agui.error and no log line. 240 s
  # stays under the gateway route's 300 s request timeout (httproutes.yaml).
  UAR_LLM__TIMEOUT_SECS: "240"

  # DashScope text-embedding-v4, 1024 dims.
  UAR_LLM__EMBEDDING__BACKEND: "openai"
  UAR_LLM__EMBEDDING__MODEL: "text-embedding-v4"
  UAR_LLM__EMBEDDING__BASE_URL: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  UAR_LLM__EMBEDDING__VECTOR_DIMENSION: "1024"
  # DashScope rejects embedding requests with more than 10 inputs.
  UAR_LLM__EMBEDDING__BATCH_SIZE: "10"

  RUST_LOG: "info"
