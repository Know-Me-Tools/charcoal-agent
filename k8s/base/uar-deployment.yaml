# UAR — no PVC: persistence is the remote SurrealDB, not the embedded store.
# 2026-10-24 (fix/uar-pin-v1-3-0): pinned to UAR v1.3.0 (tag v1.3.0, source
# 77446974), index digest sha256:f67a36f1a6fb886379c6947f605a88945a94481c8b3c4e1d998b9b481cea0697
# (linux/amd64 manifest 20c58178...), from publish run 40091743841 (both platform
# builds and the manifest merge succeeded). The release is still marked
# "verification pending": product integration tests and supported-profile
# acceptance were not published when this was pinned. It refreshes dependencies
# (reqwest 0.13.5, RMCP 3.7.0, Wasmtime 47.0.4, Kreuzberg 4.10.4, SurrealDB
# lifecycle sources 3.3.0); v1.2.3..v1.3.0 adds no UAR_* key or startup directory.
# The a42f23bb model-verification step below still applies after this roll.
# Rollback: kubectl --context know-me -n knowme rollout undo deploy/uar, or the
# previous digest sha256:7fa7973fdcc0968d1fd0fa3a497f9c5a51daa97a653a48f01a2a1507fdbe3195
# (v1.2.3; needs UAR_SERVER__INGEST_DIRECTORY in uar-configmap.yaml). The
# paragraphs below describe that previous pin.
# 2026-10-22 (fix/uar-pin-v1-2-3): pinned to UAR v1.2.3 (tag v1.2.3, source
# c4a65625), index digest sha256:7fa7973fdcc0968d1fd0fa3a497f9c5a51daa97a653a48f01a2a1507fdbe3195
# (linux/amd64 manifest 8c1fa484...), from "Build and Publish Images" run
# 39875057583 (both platform builds and the manifest merge succeeded). The release
# notes record a native gate and a gate against this exact published amd64 image
# (95 core, 60 safety, 5 cancellation cases). They do not certify PostgreSQL, arm64
# runtime or paid providers. 1.2.0 added caller-tool declarations; the site never
# sends any, because server/src/domain/chat_request.rs rebuilds the request from an
# allowlist and drops `tools`. The a42f23bb model-verification step below still
# applies after this roll.
# Rollback: kubectl --context know-me -n knowme rollout undo deploy/uar, or the
# previous digest sha256:064f5004fb3ba76506abce5cf81285b2a8aa3e54fa5a22e2c2bfc97b1211e43b
# (v1.1.0). The paragraphs below describe that previous pin.
# 2026-10-15 (fix/uar-pin-v1-1-0): pinned to UAR v1.1.0 (tag v1.1.0, source
# d815ef72), index digest sha256:064f5004fb3ba76506abce5cf81285b2a8aa3e54fa5a22e2c2bfc97b1211e43b
# (linux/amd64 manifest 94f78a7e...). It carries the per-provider llm.timeout_secs
# fix (UAR #384), so UAR_LLM__TIMEOUT_SECS in uar-configmap.yaml reaches the site
# agents; the previous pin cut every model call at 60 s. Do NOT pin the `:main`
# build 0bd48ae6 (the #384 merge): it broke chat on 2026-10-15 (see #114).
# Rollback: kubectl --context know-me -n knowme rollout undo deploy/uar, or the
# previous digest sha256:7dc13eb3dab415a2c9dbd6989fdbdcc1ed4745c24a2dcb10912e2330a198fcf5
# (:main, 3e6af7c4). The paragraphs below describe that previous pin.
# Image pinned by digest (ci-supply-chain-pins): the `main` image built by
# Prometheus-AGS/universal-agent-runtime's "Build and Publish Images" run 38435095046
# for commit 3e6af7c4 (merge of #381), manifest published 2026-10-13 17:57 UTC.
# The digest is
# ghcr.io/prometheus-ags/universal-agent-runtime@sha256:7dc13eb3dab415a2c9dbd6989fdbdcc1ed4745c24a2dcb10912e2330a198fcf5
# (read from both the CI log and the live registry; the :main and :sha-3e6af7c4
# tags resolve to it) and is a linux/amd64 + linux/arm64 index. It replaces the
# 2cc9a182 build (@sha256:e955789aa6ae...) and adds eight commits:
#   - #381 `preapproved_tools` on an mcpServers entry (administrator-only list of tools
#     that skip approval; unused until the site-websearch wiring lands);
#   - a42f23bb: runs require a VERIFIED model. Chat answers 422 `model_not_verified`
#     until `POST /api/providers/<id>/test` has verified the model, and the receipt is
#     invalidated by any provider or credential change. scripts/seed-site-agent.sh
#     (SEED_MODE=agent) does this; run site-content.yml with sync=agent right after
#     this image rolls, and again after any key rotation. Chat is down in between;
#     the operator may close it with the kill switch for that window;
#   - 4ee38989 (gateway aliases in model discovery), c314099b (validated history in
#     delegated runs), 536df169 and 501deac8/efb17986/b4244aea (verification digests,
#     admission placement fixes).
# Rollback is the previous digest, ghcr.io/prometheus-ags/universal-agent-runtime
# @sha256:e955789aa6aea70853d4e19ce95b5c5774750d232472c048bd4763c96e5513f5 (2cc9a182). The image has no vcs revision label; the
# commit above comes from the CI run that published it. Renovate tracks this digest
# going forward (renovate.json); bump deliberately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uar
  namespace: knowme
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: knowme-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uar
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uar
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: knowme-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: uar
          # RUNBOOK, bumping this image to a build that includes UAR a42f23bb
          # ("unify verified agent and model execution selection"): chat answers
          # HTTP 422 `model_not_verified` until each model the agents use has been
          # verified. Order: (1) roll this image; (2) the OPERATOR runs, from their
          # own shell with kubectl access to the know-me cluster,
          #   scripts/ops/verify-site-models.sh --context know-me [--web] [--smoke]
          # (it port-forwards svc/uar, reads the admin key and gate client from
          # the cluster Secrets inside its own process, verifies each agent
          # model, and with --smoke proves one chat turn). CI cannot do this: it
          # cannot read uar-secrets by design, so the site-content.yml sync=agent
          # job only warns "NOT VERIFIED". Start the script before step (1)
          # finishes: it waits up to 5 minutes for /readyz. Expect chat down for
          # the minutes between (1) and (2).
          # The verification is a real tiny LLM call. Its receipt is bound to the
          # provider configuration and credential revision, so re-verify after any
          # provider edit or API key rotation. Builds before a42f23bb (the 2cc9a182
          # pin this replaced) have no gate, so the step only matters from this pin on.
          image: ghcr.io/prometheus-ags/universal-agent-runtime:1.3.0@sha256:f67a36f1a6fb886379c6947f605a88945a94481c8b3c4e1d998b9b481cea0697
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 6565
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uar-config
            - secretRef:
                name: uar-secrets
          # site-web-search 16.5.2: MCP servers come from a mounted mcp.json
          # (uar-mcp-configmap.yaml); the image ships none.
          env:
            - name: MCP_CONFIG_PATH
              value: /etc/uar/mcp/mcp.json
            # `Bearer <token>` that mcp.json's `secret_ref:
            # env:WEBSEARCH_MCP_AUTH` resolves for the websearch server. The
            # envFrom above would also carry it; named here so the dependency
            # is visible. optional: until the operator adds the key to
            # uar-secrets, UAR starts without it, fails to connect the
            # websearch server and skips it ("MCP server failed to connect;
            # skipping it, registry continues without it", UAR
            # src/mcp/registry.rs), so a rollout before the Secret exists
            # cannot take UAR down.
            - name: WEBSEARCH_MCP_AUTH
              valueFrom:
                secretKeyRef:
                  name: uar-secrets
                  key: WEBSEARCH_MCP_AUTH
                  optional: true
          # UAR takes 50 to 95 seconds to start (it connects to SurrealDB, runs
          # governance preflight and starts its listeners). The liveness probe
          # alone gives up after about 75 seconds (30s delay + 3 failures at
          # 15s), so a slow start was killed with exit 137 (seen on the first
          # deploy). Liveness and readiness do not run until this probe
          # succeeds; it allows 5 minutes (30 x 10s).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: uar-data
              mountPath: /var/lib/uar
            - name: uar-mcp
              mountPath: /etc/uar/mcp
              readOnly: true
      volumes:
        - name: uar-data
          emptyDir: {}
        - name: uar-mcp
          configMap:
            name: uar-mcp
