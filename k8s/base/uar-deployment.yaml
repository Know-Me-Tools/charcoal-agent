# UAR — no PVC: persistence is the remote SurrealDB, not the embedded store.
# Image pinned by digest (ci-supply-chain-pins): the `main` image built by
# Prometheus-AGS/universal-agent-runtime's "Build and Publish Images" run for
# commit 2cc9a182 (merge of #378), manifest published 2026-10-11 17:07 UTC. It
# is the first main image since 2026-10-04: every build in between failed on
# the .dockerignore and entity-graph-react gaps that #378 fixed. It descends
# from #344/#345/#350/#353/#321 (the previous pin's features) and adds #358
# (usage on non-streaming responses), #361 (usage on cancelled runs) and #360
# (guardrails and usage). The digest is
# ghcr.io/prometheus-ags/universal-agent-runtime@sha256:e955789aa6aea70853d4e19ce95b5c5774750d232472c048bd4763c96e5513f5
# and resolves a linux/amd64 + linux/arm64 index. The image has no vcs revision
# label; the commit above comes from the CI run that published it. Renovate
# tracks this digest going forward (renovate.json); bump deliberately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uar
  namespace: knowme
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: knowme-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uar
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uar
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: knowme-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: uar
          # RUNBOOK, bumping this image to a build that includes UAR a42f23bb
          # ("unify verified agent and model execution selection"): chat answers
          # HTTP 422 `model_not_verified` until each model the agents use has been
          # verified. Order: (1) roll this image; (2) the OPERATOR runs, from their
          # own shell with kubectl access to the know-me cluster,
          #   scripts/ops/verify-site-models.sh --context know-me [--web] [--smoke]
          # (it port-forwards svc/uar, reads the admin key and gate client from
          # the cluster Secrets inside its own process, verifies each agent
          # model, and with --smoke proves one chat turn). CI cannot do this: it
          # cannot read uar-secrets by design, so the site-content.yml sync=agent
          # job only warns "NOT VERIFIED". Start the script before step (1)
          # finishes: it waits up to 5 minutes for /readyz. Expect chat down for
          # the minutes between (1) and (2).
          # The verification is a real tiny LLM call. Its receipt is bound to the
          # provider configuration and credential revision, so re-verify after any
          # provider edit or API key rotation. Older builds (like the one pinned
          # before that bump) have no gate, so the step is optional until then.
          image:ghcr.io/prometheus-ags/universal-agent-runtime:main@sha256:e955789aa6aea70853d4e19ce95b5c5774750d232472c048bd4763c96e5513f5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 6565
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uar-config
            - secretRef:
                name: uar-secrets
          # UAR takes 50 to 95 seconds to start (it connects to SurrealDB, runs
          # governance preflight and starts its listeners). The liveness probe
          # alone gives up after about 75 seconds (30s delay + 3 failures at
          # 15s), so a slow start was killed with exit 137 (seen on the first
          # deploy). Liveness and readiness do not run until this probe
          # succeeds; it allows 5 minutes (30 x 10s).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: uar-data
              mountPath: /var/lib/uar
      volumes:
        - name: uar-data
          emptyDir: {}
