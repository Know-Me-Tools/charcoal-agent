# UAR — no PVC: persistence is the remote SurrealDB, not the embedded store.
# Image tag is managed by the `images:` entry in kustomization.yaml; CI sets
# it to a digest with `kustomize edit set image` and Renovate tracks it
# afterwards (see renovate.json).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uar
  namespace: knowme
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: knowme-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uar
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uar
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: knowme-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: uar
          image: ghcr.io/prometheus-ags/universal-agent-runtime:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 6565
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uar-config
            - secretRef:
                name: uar-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: uar-data
              mountPath: /var/lib/uar
      volumes:
        - name: uar-data
          emptyDir: {}
