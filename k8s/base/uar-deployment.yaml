# UAR — no PVC: persistence is the remote SurrealDB, not the embedded store.
# Image pinned by digest (ci-supply-chain-pins): the `main` image created on
# 2026-10-04 21:37 UTC by the build of commit bb6ea8ba (merge of
# Prometheus-AGS/universal-agent-runtime#344). That commit descends from #345
# (a KB's chunk_strategy is honoured at ingest), #350 (version-safe sentence
# chunkers), #353 (per-KB retrieval_min_score and retrieval_top_k) and #321
# (ES256/JWKS verification). The digest is
# ghcr.io/prometheus-ags/universal-agent-runtime@sha256:688a97e42a0be63247b95c3b1a3c5ebd9da9078c79d63c4f31d979d469b77888
# and resolves a linux/amd64 + linux/arm64 index. Its attestation does not
# expose a readable vcs revision, so the commit above comes from the build
# timing; the KB's retrieval settings round-tripping through the API proves
# #353 is in it. Renovate tracks this digest going forward (renovate.json);
# bump deliberately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uar
  namespace: knowme
  labels:
    app.kubernetes.io/name: uar
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: knowme-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uar
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uar
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: knowme-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: uar
          image: ghcr.io/prometheus-ags/universal-agent-runtime:main@sha256:688a97e42a0be63247b95c3b1a3c5ebd9da9078c79d63c4f31d979d469b77888
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 6565
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uar-config
            - secretRef:
                name: uar-secrets
          # UAR takes 50 to 95 seconds to start (it connects to SurrealDB, runs
          # governance preflight and starts its listeners). The liveness probe
          # alone gives up after about 75 seconds (30s delay + 3 failures at
          # 15s), so a slow start was killed with exit 137 (seen on the first
          # deploy). Liveness and readiness do not run until this probe
          # succeeds; it allows 5 minutes (30 x 10s).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: uar-data
              mountPath: /var/lib/uar
      volumes:
        - name: uar-data
          emptyDir: {}
