apiVersion: v1
kind: Service
metadata:
  name: knowme-web
  namespace: knowme
  labels:
    app.kubernetes.io/name: knowme-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: knowme-site
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knowme-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
